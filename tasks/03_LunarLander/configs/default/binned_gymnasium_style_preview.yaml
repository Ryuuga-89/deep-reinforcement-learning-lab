subtask: default
algorithm: ppo

model:
  id: lunar_binned
  options:
    preset: gymnasium_style

run:
  name: binned_gymnasium_style_preview
  seed: 42
  max_env_steps: 500000
  eval_episodes: 100
  eval_seed_offset: 0
  video_seed_offset: 100
  log_interval_steps: 32768
  video_enabled: true
  video_interval_steps: 32768
  video_episodes: 16
  save_checkpoint: true

hyperparameters:
  gamma: 0.99
  learning_rate: 0.0003
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  rollout_steps: 1024
  n_envs: 4
  n_epochs: 10
  minibatch_size: 64
  hidden_sizes:
    - 128
    - 128
  ac_type: shared
